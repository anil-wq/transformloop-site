# Owner: Anil Chintalacheruvu
# Why: Standing rule for transformloop.ai: nothing goes into the code without context.
# This gate runs on every change. It enforces the write, retrieval and use gates (see context/site.md).
# Covers: .github/workflows/context-gate.yml
name: Context gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check context gates
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"
          FAIL=0
          echo "== Write gate: every context file names Owner, Why and Covers =="
          for f in context/*.md; do
            for k in Owner Why Covers; do
              if ! grep -q "^$k:" "$f"; then
                echo "::error file=$f::Write gate: missing the $k line"
                FAIL=1
              fi
            done
          done
          echo "== Retrieval gate: every code file is covered by a context file =="
          for c in $(git ls-files | grep -E '[.](html|css|js)$'); do
            if ! grep -h "^Covers:" context/*.md | grep -qF "$c"; then
              echo "::error::Retrieval gate: $c is not covered by any context file"
              FAIL=1
            fi
          done
          echo "== Use gate: a changed code file needs its context changed in the same change =="
          for c in $(echo "$CHANGED" | grep -E '[.](html|css|js)$' || true); do
            for f in $(grep -lE "^Covers:.*$c" context/*.md || true); do
              if ! echo "$CHANGED" | grep -qx "$f"; then
                echo "::error::Use gate: $c changed but $f (its context) was not updated"
                FAIL=1
              fi
            done
          done
          exit $FAIL
